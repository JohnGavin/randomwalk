# Workflow derived from https://github.com/ropensci/rix/tree/main/.github/workflows
# and https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  deployments: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create nix folder to silence warning
        run: mkdir -p ~/.nix-defexpr/channels

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/rstats-on-nix/nixpkgs/archive/refs/heads/r-daily.tar.gz

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache R libraries
        uses: actions/cache@v4
        with:
          path: ~/R_libs
          key: r-libs-${{ runner.os }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            r-libs-${{ runner.os }}-

      - uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix  # Public R packages cache - check this FIRST

      - uses: cachix/cachix-action@v15
        with:
          name: johngavin  # Project-specific cache - check this SECOND
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true  # Manual selective push below

      - name: Run build script
        run: |
          nix-shell default-ci.nix --quiet --run "Rscript -e '
            # Build pkgdown site
            # Note: Removed --pure flag to allow pkgdown to download external assets
            # (JS/CSS from CDNs like cdnjs.cloudflare.com)

            # Clean any existing site first
            if (dir.exists(\"docs\")) {
              pkgdown::clean_site(force = TRUE)
            }

            # Build pkgdown site (skip article building for now)
            pkgdown::build_reference()
            pkgdown::build_home()
            pkgdown::build_articles_index()

            # MANUALLY COPY PRE-BUILT VIGNETTES AND ASSETS
            # This is critical because we skip pkgdown::build_articles()
            # We must copy both the HTML files and their associated *_files directories
            
            if (!dir.exists("docs/articles")) {
              dir.create("docs/articles", recursive = TRUE)
            }
            
            # Copy all HTML files from vignettes to docs/articles
            html_files <- list.files("vignettes", pattern = "\\.html$", full.names = TRUE)
            if (length(html_files) > 0) {
              file.copy(html_files, "docs/articles/", overwrite = TRUE)
              message(sprintf("Copied %d vignette HTML files to docs/articles/", length(html_files)))
            }
            
            # Copy all *_files directories (assets) from vignettes to docs/articles
            # This includes the massive Shinylive WASM binaries for dashboards
            asset_dirs <- list.dirs("vignettes", full.names = TRUE, recursive = FALSE)
            asset_dirs <- asset_dirs[grep("_files$", asset_dirs)]
            
            if (length(asset_dirs) > 0) {
              for (dir in asset_dirs) {
                dirname <- basename(dir)
                target <- file.path("docs/articles", dirname)
                
                # Remove target if it exists to ensure clean copy
                if (dir.exists(target)) {
                  unlink(target, recursive = TRUE)
                }
                
                file.copy(dir, "docs/articles/", recursive = TRUE)
                message(sprintf("Copied asset directory %s to docs/articles/", dirname))
              }
            }
          '"

      - name: Download WebAssembly library from latest release
        if: github.event_name != 'pull_request'
        run: |
          # Create directory for wasm files
          mkdir -p docs/wasm

          # Download library.data and library.js.metadata from latest release
          # These files will be served from the same origin as the dashboard
          # avoiding CORS issues
          gh release download --repo JohnGavin/randomwalk \
            --pattern "library.data" \
            --pattern "library.js.metadata" \
            --dir docs/wasm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Install randomwalk package so shinylive::export() can load it
      # This solves the chicken-and-egg problem from PR #34
      # Install to a user-writable location since Nix store is read-only
      - name: Install randomwalk package
        run: |
          mkdir -p $HOME/R_libs
          export R_LIBS_USER=$HOME/R_libs
          nix-shell default-ci.nix --keep R_LIBS_USER --quiet --run "R CMD INSTALL --library=$HOME/R_libs ."

# Export async dashboard with R shinylive (re-enabled for issue #37)
      - name: Export async dashboard with R shinylive
        run: |
          export R_LIBS_USER=$HOME/R_libs
          nix-shell default-ci.nix --keep R_LIBS_USER --quiet --run "Rscript -e '
            Sys.setenv(R_LIBS_USER = paste0(Sys.getenv(\"HOME\"), \"/R_libs\"))
            # Clean destination directory to avoid cached/stale files
            if (dir.exists(\"docs/articles/dashboard_async\")) {
              unlink(\"docs/articles/dashboard_async\", recursive = TRUE)
            }

            # Export async Shiny app to Shinylive format
            # This will include the updated parameters from PR #36 (issue #33)
            # Note: wasm_packages=FALSE to skip automatic package resolution
            # We provide randomwalk via GitHub release (library.data mounted in app)
            shinylive::export(
              appdir = \"inst/shiny/dashboard_async\",
              destdir = \"docs/articles/dashboard_async\",
              wasm_packages = FALSE
            )
          '"

      - name: Selectively push randomwalk to cachix
        run: |
          # Find and push only randomwalk and btw packages to cachix
          nix-store -qR --include-outputs $(nix-instantiate default-ci.nix) | \
            grep -E 'randomwalk|btw' | \
            cachix push johngavin

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: false
          branch: gh-pages
          folder: docs
