url: https://johngavin.github.io/randomwalk/

template:
  bootstrap: 5
  bootswatch: cosmo
  includes:
    in_header: |
      <meta name="shinylive:serviceworker_dir" content="..">

home:
  title: randomwalk - Asynchronous Pixel Walking Simulation
  description: >
    Parallel random walk simulations that create fractal graphs through
    asynchronous pixel walking on a grid.
  links:
  - text: Try Async Parallel Demo
    href: articles/dynamic_broadcasting.html

navbar:
  structure:
    left:  [home, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      # NOTE: Disabled broken vignettes (Issue #132)
      # - text: Interactive Dashboard (Sync)
      #   href: articles/dashboard.html
      # - text: Async/Parallel Dashboard
      #   href: articles/dashboard_async.html
      - text: Async Parallel Random Walks (Basic)
        href: articles/dynamic_broadcasting.html
      - text: Comprehensive Async Dashboard (NEW)
        href: articles/dashboard_comprehensive.html
      # - text: Telemetry and Pipeline Statistics
      #   href: articles/telemetry.html

articles:
- title: Interactive Demos
  navbar: ~
  contents:
  # NOTE: Articles in vignettes/articles/ are auto-discovered by pkgdown
  # Shinylive demos (not standard R vignettes):
  - articles/dynamic_broadcasting
  - articles/dashboard_comprehensive

footer:
  structure:
    left: developed_by
    right: built_with
