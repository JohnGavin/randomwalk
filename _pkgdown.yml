url: https://johngavin.github.io/randomwalk/

template:
  bootstrap: 5
  bootswatch: cosmo
  includes:
    in_header: |
      <meta name="shinylive:serviceworker_dir" content="..">
    after_body: |
      <script src="https://johngavin.github.io/randomwalk/open-vignettes-in-new-tab.js"></script>

home:
  title: randomwalk - Asynchronous Pixel Walking Simulation
  description: >
    Parallel random walk simulations that create fractal graphs through
    asynchronous pixel walking on a grid.
  links:
  - text: Async Parallel Demo
    href: articles/dynamic_broadcasting.html
  - text: Comprehensive Dashboard
    href: articles/dashboard_comprehensive.html
  - text: Step Distribution Analysis
    href: articles/step_distribution_analysis.html
  - text: Telemetry & Performance
    href: articles/telemetry.html
  - text: GitHub Repository
    href: https://github.com/JohnGavin/randomwalk
  - text: Project Wiki
    href: https://github.com/JohnGavin/randomwalk/wiki

navbar:
  structure:
    left:  [home, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      # ═══════════════════════════════════════════════════════════
      # R-SHINYLIVE: Interactive dashboards (run in browser via WebR)
      # ═══════════════════════════════════════════════════════════
      - text: "──── R-Shinylive Dashboards ────"
      - text: Comprehensive Dashboard (All Features)
        href: articles/dashboard_comprehensive.html
      - text: Sync Sequential Random Walks
        href: articles/dynamic_broadcasting.html
      # ═══════════════════════════════════════════════════════════
      # WEBR: Analysis vignettes using WebR
      # ═══════════════════════════════════════════════════════════
      - text: "──── WebR Analysis ────"
      - text: Step Distribution Analysis
        href: articles/step_distribution_analysis.html
      # ═══════════════════════════════════════════════════════════
      # BACKGROUND: Project documentation and development info
      # ═══════════════════════════════════════════════════════════
      - text: "──── Background & Documentation ────"
      - text: Defensive Programming Patterns
        href: articles/defensive_programming.html
      - text: Telemetry and Pipeline Performance
        href: articles/telemetry.html

# Organize articles on the Articles index page
articles:
- title: "R-Shinylive Dashboards"
  desc: "Interactive dashboards running in your browser via WebR"
  contents:
  - dashboard_comprehensive
  - dynamic_broadcasting
- title: "WebR Analysis"
  desc: "Statistical analysis vignettes using WebR"
  contents:
  - step_distribution_analysis
- title: "Background & Documentation"
  desc: "Project documentation and development patterns"
  contents:
  - defensive_programming
  - telemetry

footer:
  structure:
    left: developed_by
    right: built_with
