name: Build R-WASM Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-cran-repo:
    uses: r-wasm/actions/.github/workflows/deploy-cran-repo.yml@v2
    with:
      # Build randomwalk package and its dependencies for WebR
      packages: |
        logger
        ggplot2
        nanonext
        mirai
        crew
        shiny
        .
      # Use r-lib.r-universe.dev for async packages (nanonext, mirai, crew)
      repo-url: |
        https://cran.r-project.org
        https://r-lib.r-universe.dev
      # Deploy to repo/ subdirectory on GitHub Pages
      repo-subdir: 'repo'
