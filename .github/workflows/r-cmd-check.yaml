# R CMD check workflow via Nix
# Runs R CMD check in CI without rebuilding pkgdown site
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Create nix folder to silence warning
        run: mkdir -p ~/.nix-defexpr/channels

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/rstats-on-nix/nixpkgs/archive/refs/heads/r-daily.tar.gz

      - uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix  # Public R packages cache - check this FIRST

      - uses: cachix/cachix-action@v15
        with:
          name: johngavin  # Project-specific cache - check this SECOND
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true  # Don't push during checks

      - name: Build development environment
        run: nix-shell default-ci.nix --quiet --run "Rscript -e \"sessionInfo()\""

      - name: Run R CMD check
        run: nix-shell default-ci.nix --quiet --run "Rscript -e \"devtools::check(error_on = 'warning', check_dir = 'check')\""

      - name: Test coverage
        run: nix-shell default-ci.nix --quiet --run "Rscript -e \"covr::codecov(quiet = FALSE)\""
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: check/
