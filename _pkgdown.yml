url: https://johngavin.github.io/randomwalk/

template:
  bootstrap: 5
  bootswatch: cosmo
  includes:
    in_header: |
      <meta name="shinylive:serviceworker_dir" content="..">
    after_body: |
      <script src="https://johngavin.github.io/randomwalk/open-vignettes-in-new-tab.js"></script>

home:
  title: randomwalk - Random Walk Fractal Simulation
  description: >
    Parallel random walk simulations that create fractal graphs through
    pixel walking on a grid. Features sync and async modes with crew workers.
  links:
  - text: Interactive Dashboard (Browser)
    href: articles/dashboard_comprehensive.html
  - text: Step Distribution Analysis
    href: articles/step_distribution_analysis.html
  - text: Telemetry & Performance
    href: articles/telemetry.html
  - text: GitHub Repository
    href: https://github.com/JohnGavin/randomwalk
  - text: Project Wiki
    href: https://github.com/JohnGavin/randomwalk/wiki

navbar:
  structure:
    left:  [home, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      # ═══════════════════════════════════════════════════════════
      # R-SHINYLIVE: Interactive dashboards (run in browser via WebR)
      # ═══════════════════════════════════════════════════════════
      - text: "──── Browser Dashboard (WebR) ────"
      - text: Interactive Dashboard
        href: articles/dashboard_comprehensive.html
      # ═══════════════════════════════════════════════════════════
      # WEBR: Analysis vignettes using WebR
      # ═══════════════════════════════════════════════════════════
      - text: "──── WebR Analysis ────"
      - text: Step Distribution Analysis
        href: articles/step_distribution_analysis.html
      # ═══════════════════════════════════════════════════════════
      # BACKGROUND: Project documentation and development info
      # ═══════════════════════════════════════════════════════════
      - text: "──── Background & Documentation ────"
      - text: DLA Theory & Mathematical Foundations
        href: articles/dla_theory.html
      - text: Defensive Programming Patterns
        href: articles/defensive_programming.html
      - text: Telemetry and Pipeline Performance
        href: articles/telemetry.html

footer:
  structure:
    left: developed_by
    right: built_with
