# nix-ci.yml
#
# Complete CI workflow for R package development with Nix
#
# This workflow implements the reproducible development pattern:
# 1. Build package as nix derivation from GitHub source
# 2. Cache derivation in johngavin cachix (after pulling from rstats-on-nix)
# 3. Run tests in nix environment
# 4. Build pkgdown site
#
# Cache priority: rstats-on-nix (R packages) → johngavin (project package)
#
# Generated by: R/setup/generate_nix_files.R

name: Nix CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Build package derivation and push to cachix
  build-and-cache-package:
    name: Build & Cache Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/1482d00f8f658fd443526febba6c9fd9754cb356.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto

      # Cache 1: rstats-on-nix (all CRAN R packages)
      - name: Configure rstats-on-nix cache
        uses: cachix/cachix-action@v14
        with:
          name: rstats-on-nix
          # Read-only access (no auth token needed)

      # Cache 2: johngavin (project-specific package)
      - name: Configure johngavin cache
        uses: cachix/cachix-action@v14
        with:
          name: johngavin
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Write access for pushing our package

      - name: Build package derivation
        id: build
        run: |
          echo "Building package.nix as nix derivation..."
          nix-build package.nix

          echo "Store path: $(readlink -f result)"
          echo "Listing package contents:"
          ls -lh result/

          # Save store path for later steps
          echo "store_path=$(readlink -f result)" >> $GITHUB_OUTPUT

      - name: Push package to johngavin cache
        run: |
          echo "Pushing package derivation to johngavin cachix..."
          nix-store -qR --include-outputs result | cachix push johngavin
          echo "✓ Package cached successfully"

      - name: Push dev environment to johngavin cache
        run: |
          echo "Pushing dev environment to johngavin cachix..."
          nix-store -qR --include-outputs $(nix-instantiate default-ci.nix) | cachix push johngavin
          echo "✓ Dev environment cached successfully"

      - name: Verify package structure
        run: |
          echo "Package structure:"
          tree -L 2 result/ || find result/ -maxdepth 2 -print

  # Job 2: Run R CMD check
  r-cmd-check:
    name: R CMD check
    needs: build-and-cache-package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/1482d00f8f658fd443526febba6c9fd9754cb356.tar.gz

      - name: Configure caches
        uses: cachix/cachix-action@v14
        with:
          name: rstats-on-nix

      - name: Configure johngavin cache
        uses: cachix/cachix-action@v14
        with:
          name: johngavin
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run R CMD check
        run: |
          echo "Entering nix-shell with dev tools..."
          nix-shell default-ci.nix --run "
            echo 'R version:'
            Rscript -e 'R.version.string'

            echo 'Session info:'
            Rscript -e 'sessionInfo()'

            echo 'Running R CMD check...'
            Rscript -e 'rcmdcheck::rcmdcheck(args = c(\"--no-manual\", \"--as-cran\"), error_on = \"warning\", check_dir = \"check\")'
          "

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: check/

  # Job 3: Run tests
  test:
    name: Run Tests
    needs: build-and-cache-package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/1482d00f8f658fd443526febba6c9fd9754cb356.tar.gz

      - name: Configure caches
        uses: cachix/cachix-action@v14
        with:
          name: rstats-on-nix

      - name: Configure johngavin cache
        uses: cachix/cachix-action@v14
        with:
          name: johngavin
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run tests
        run: |
          nix-shell default-ci.nix --run "
            echo 'Running testthat tests...'
            Rscript -e 'devtools::test(stop_on_failure = TRUE)'
          "

      - name: Run test coverage
        if: github.event_name == 'push'
        run: |
          nix-shell default-ci.nix --run "
            echo 'Computing test coverage...'
            Rscript -e 'covr::package_coverage()' > coverage.txt
            cat coverage.txt
          "

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt

  # Job 4: Build pkgdown site
  pkgdown:
    name: Build pkgdown site
    needs: build-and-cache-package
    runs-on: ubuntu-latest
    # Only run on pushes to main, not on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    # Grant write permissions for GitHub Pages deployment
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/1482d00f8f658fd443526febba6c9fd9754cb356.tar.gz

      - name: Configure caches
        uses: cachix/cachix-action@v14
        with:
          name: rstats-on-nix

      - name: Configure johngavin cache
        uses: cachix/cachix-action@v14
        with:
          name: johngavin
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build pkgdown site
        run: |
          nix-shell default-ci.nix --run "
            echo 'Building pkgdown site...'
            Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'
          "

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          clean: true

  # Job 5: Check nix file generation
  check-nix-generation:
    name: Verify Nix Files
    needs: build-and-cache-package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/1482d00f8f658fd443526febba6c9fd9754cb356.tar.gz

      - name: Configure caches
        uses: cachix/cachix-action@v14
        with:
          name: rstats-on-nix

      - name: Verify nix files are up to date
        run: |
          nix-shell default-ci.nix --run "
            echo 'Regenerating nix files...'
            Rscript -e 'source(\"R/setup/generate_nix_files.R\"); generate_all_nix_files(verify = FALSE)'

            echo 'Checking for differences...'
            if ! git diff --exit-code package.nix default-ci.nix; then
              echo '❌ ERROR: Nix files are out of date!'
              echo 'Run: source(\"R/setup/generate_nix_files.R\"); generate_all_nix_files()'
              echo 'Then commit the updated files.'
              exit 1
            fi

            echo '✓ Nix files are up to date'
          "

  # Summary job - requires all others to pass
  ci-success:
    name: CI Success
    needs: [build-and-cache-package, r-cmd-check, test, pkgdown, check-nix-generation]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.build-and-cache-package.result }}" != "success" ]; then
            echo "❌ build-and-cache-package failed"
            exit 1
          fi
          if [ "${{ needs.r-cmd-check.result }}" != "success" ]; then
            echo "❌ r-cmd-check failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ test failed"
            exit 1
          fi
          # pkgdown and check-nix-generation might be skipped
          if [ "${{ needs.pkgdown.result }}" == "failure" ]; then
            echo "❌ pkgdown failed"
            exit 1
          fi
          if [ "${{ needs.check-nix-generation.result }}" == "failure" ]; then
            echo "❌ check-nix-generation failed"
            exit 1
          fi

          echo "✅ All CI checks passed!"
