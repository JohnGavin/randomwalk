# Workflow derived from https://github.com/ropensci/rix/tree/main/.github/workflows
# Builds and tests the Nix environment
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: nix-builder

permissions:
  contents: read

jobs:
  run-x86_64-linux:
    name: nix builder for Ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4

    - name: Create nix folder to silence warning
      run: mkdir -p ~/.nix-defexpr/channels

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    # Magic Nix Cache removed - redundant with johngavin cachix
    # Saves 20+ minutes of GitHub Actions time per run

    - uses: cachix/cachix-action@v15
      with:
        name: rstats-on-nix  # Public R packages cache - check this FIRST

    - uses: cachix/cachix-action@v15
      with:
        name: johngavin  # Project-specific cache - check this SECOND
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        skipPush: true  # Don't push standard R packages to johngavin cachix

    - name: Build Nix Environment (CI dependencies)
      run: |
        nix-build --quiet default-ci.nix
        nix-shell --quiet default-ci.nix --run "R --version"

    - name: Build randomwalk Package as Nix Derivation
      run: |
        nix-build --quiet package.nix

    - name: Selectively push randomwalk to cachix
      run: |
        # Push ONLY randomwalk package to johngavin cachix (not R dependencies)
        # R dependencies come from rstats-on-nix cache
        nix-store -qR --include-outputs result | \
          grep -E 'randomwalk' | \
          cachix push johngavin

