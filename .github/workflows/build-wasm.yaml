name: Build R-WASM Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-cran-repo:
    uses: r-wasm/actions/.github/workflows/deploy-cran-repo.yml@v2
    with:
      # Build randomwalk package and its dependencies for WebR
      # Note: nanonext/mirai/crew must be available in default repos for this to work
      packages: |
        logger
        ggplot2
        shiny
        .
