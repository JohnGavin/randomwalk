# Code Coverage Workflow
# Generates coverage using standard R (not Nix) since covr has Nix compatibility issues
# Saves results to inst/extdata/coverage.rds for use in telemetry vignette
#
# Runs on:
# - Push to main when R/ or tests/ change
# - Manual trigger (workflow_dispatch)

name: Code Coverage

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Needed to commit coverage.rds back

jobs:
  coverage:
    runs-on: ubuntu-latest
    # Coverage is informational - don't block builds on transient failures
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Only install Depends/Imports - skip Suggests which includes
          # nanonext/crew/mirai that require NNG system library
          dependencies: '"hard"'
          extra-packages: |
            any::covr
            any::devtools

      - name: Generate coverage
        run: |
          Rscript -e '
            library(covr)

            cat("=== Generating Code Coverage ===\n")
            cat("R version:", R.version.string, "\n")
            cat("covr version:", as.character(packageVersion("covr")), "\n\n")

            # Generate coverage - simple approach
            coverage <- tryCatch({
              package_coverage(quiet = FALSE)
            }, error = function(e) {
              cat("Error:", conditionMessage(e), "\n")
              NULL
            })

            if (is.null(coverage)) {
              cat("WARNING: Could not generate coverage\n")
              coverage_data <- list(
                overall_pct = NA,
                file_summary = data.frame(),
                generated_at = Sys.time(),
                r_version = R.version.string,
                covr_version = as.character(packageVersion("covr")),
                git_sha = Sys.getenv("GITHUB_SHA"),
                error = "Coverage generation failed"
              )
            } else {
              # Calculate overall percentage
              overall_pct <- percent_coverage(coverage)
              cat(sprintf("Overall coverage: %.1f%%\n", overall_pct))

              # Simple file summary - just list unique files
              cov_df <- as.data.frame(coverage)
              if (nrow(cov_df) > 0) {
                files <- unique(basename(cov_df$filename))
                cat("\nFiles with coverage data:", length(files), "\n")
                cat(paste(" -", files, collapse = "\n"), "\n")
              }

              coverage_data <- list(
                overall_pct = overall_pct,
                n_files = length(unique(cov_df$filename)),
                generated_at = Sys.time(),
                r_version = R.version.string,
                covr_version = as.character(packageVersion("covr")),
                git_sha = Sys.getenv("GITHUB_SHA")
              )
            }

            # Save to inst/extdata
            dir.create("inst/extdata", recursive = TRUE, showWarnings = FALSE)
            saveRDS(coverage_data, "inst/extdata/coverage.rds")
            cat("\n=== Coverage saved to inst/extdata/coverage.rds ===\n")
          '

      - name: Commit coverage data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f inst/extdata/coverage.rds ]; then
            git add inst/extdata/coverage.rds
            if git diff --cached --quiet; then
              echo "No changes to coverage data"
            else
              git commit -m "AUTO: Update pre-computed code coverage [skip ci]"
              git push
              echo "Coverage data committed and pushed"
            fi
          else
            echo "Warning: coverage.rds not found"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: inst/extdata/coverage.rds
          retention-days: 30
          if-no-files-found: warn
